spring:
  application:
    name: viva-saude-api
  # Banco H2 em memória: os dados somem quando a API para. Bom para testar e apresentar.
  datasource:
    url: jdbc:h2:mem:vivasaude;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  mvc:
    problemdetails:
      enabled: true   # erros saem em JSON padronizado (RFC 9457)

app:
  seed: true          # cria usuários e dados fictícios ao iniciar
  jwt:
    # Em produção, defina a variável de ambiente JWT_SECRET (mínimo 32 caracteres).
    secret: ${JWT_SECRET:segredo-de-desenvolvimento-viva-saude-troque-em-producao}
    expiracao-minutos: 120
  cors:
    # Endereços do front-end que podem chamar a API (separados por vírgula)
    origens: ${CORS_ORIGENS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}
